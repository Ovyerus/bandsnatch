name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build-linux:
    strategy:
      matrix:
        platform:
          - name: x86_64
            runs-on: ubuntu-latest
          - name: aarch64
            runs-on: [self-hosted, linux, ARM64]

    runs-on: ${{ matrix.platform.runs-on }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix build

      - name: Verify standalone Linux binary
        run: |
          nix shell --inputs-from . 'nixpkgs#binutils-unwrapped^out' -c bash -euo pipefail <<'EOF'
          binary=./result/bin/bandsnatch
          headers="$(readelf -l "$binary")"
          dynamic="$(readelf -d "$binary")"
          if [[ "$headers" == *INTERP* || "$dynamic" == *"(NEEDED)"* ]]; then
            echo "Linux release must not require a dynamic loader or shared libraries" >&2
            exit 1
          fi
          "$binary" --version
          "$binary" --help
          EOF

      - name: Upload ${{ matrix.platform.name }}
        uses: actions/upload-artifact@v4
        with:
          name: bandsnatch-linux-${{ matrix.platform.name }}
          path: ./result/bin/bandsnatch

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix build

      - name: Verify standalone macOS binary
        run: |
          binary=./result/bin/bandsnatch
          dependencies="$(otool -L "$binary")"
          printf '%s\n' "$dependencies"
          while read -r library _; do
            case "$library" in
              "$binary":|/usr/lib/*|/System/Library/Frameworks/*) ;;
              *)
                echo "Unexpected macOS runtime dependency: $library" >&2
                exit 1
                ;;
            esac
          done <<< "$dependencies"
          "$binary" --version
          "$binary" --help

      - uses: actions/upload-artifact@v4
        with:
          name: bandsnatch-macos-aarch64
          path: ./result/bin/bandsnatch

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: "bandsnatch-windows-x86_64"
          path: "target/x86_64-pc-windows-msvc/release/bandsnatch.exe"

  # TODO: clippy lints & rustfmt

  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-macos-arm
      - build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Rename files
        run: |
          mkdir out && cd out

          declare -a arr=(
            "windows-x86_64"
            "macos-aarch64"
            "linux-x86_64"
            "linux-aarch64"
          )

          for target in "${arr[@]}"
          do
            if [[ "$target" == *windows* ]]; then
              src="../bandsnatch-$target/bandsnatch.exe"
              filename="bandsnatch-$target.exe"
            else
              src="../bandsnatch-$target/bandsnatch"
              filename="bandsnatch-$target"
            fi

            cp "$src" "$filename"
            sha256sum "$filename" >> "checksums.txt"
          done

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          body: Update the description for the release!
          draft: true
          files: ./out/*

      - name: Update Homebrew tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: bandsnatch
          homebrew-tap: Ovyerus/homebrew-tap
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_COMMITTER_TOKEN }}

  update-aur:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-macos-arm
      - build-windows
    permissions:
      contents: read
    container: archlinux:base-devel
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed git rust pacman-contrib
          useradd -m builder

      - name: Clone AUR package
        run: |
          runuser -u builder -- git clone \
            https://aur.archlinux.org/bandsnatch.git /home/builder/aur

      - name: Update and check package
        shell: bash
        run: |
          runuser -u builder -- bash -euo pipefail <<'EOF'
          cd /home/builder/aur
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "AUR updates require a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          sed -i \
            -e "s/^pkgver=.*/pkgver=$version/" \
            -e 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          # GCC LTO objects from ring/zstd cannot be linked by Rust's linker.
          if ! grep -Fxq "options+=('!lto')" PKGBUILD; then
            printf "\noptions+=('!lto')\n" >> PKGBUILD
          fi
          updpkgsums
          makepkg --printsrcinfo > .SRCINFO
          makepkg --force --noconfirm
          "./src/bandsnatch-$version/target/release/bandsnatch" --version
          EOF

      - name: Upload checked AUR metadata
        uses: actions/upload-artifact@v4
        with:
          name: aur-metadata
          path: |
            /home/builder/aur/PKGBUILD
            /home/builder/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-aur:
    # Never expose publishing credentials to PKGBUILD or upstream build scripts.
    runs-on: ubuntu-latest
    needs: update-aur
    permissions:
      contents: read
    concurrency:
      group: aur-bandsnatch
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download checked AUR metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-metadata
          path: aur-update

      - name: Clone fresh AUR package
        run: |
          git clone https://aur.archlinux.org/bandsnatch.git aur
          cp aur-update/PKGBUILD aur-update/.SRCINFO aur/

      - name: Publish AUR update
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "Configure the AUR_SSH_PRIVATE_KEY repository secret" >&2
            exit 1
          fi
          key="$(mktemp "$RUNNER_TEMP/aur-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/aur-hosts.XXXXXX")"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          # Ed25519 host key published at https://aur.archlinux.org/.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i \"$key\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$known_hosts\""
          cd aur
          git config user.name 'Ovyerus'
          git config user.email 'ovy@ovyerus.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date"
            exit 0
          fi
          git commit -m "Update bandsnatch to ${RELEASE_TAG#v}"
          git remote set-url origin ssh://aur@aur.archlinux.org/bandsnatch.git
          git push origin HEAD:master
